name: Refresh contribution snake

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: read

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'NamanOG/NamanOG' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate light and dark SVGs
        # Platane/snk v3, resolved on 2026-10-10.
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: NamanOG
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=%23626b65
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23acb2af

      - name: Validate generated SVGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for name in ('github-snake.svg', 'github-snake-dark.svg'):
              path = Path('dist') / name
              root = ET.parse(path).getroot()
              if root.tag != '{http://www.w3.org/2000/svg}svg' or path.stat().st_size < 1000:
                  raise ValueError(f'Invalid snake SVG: {name}')
          PY

      - name: Publish to the output branch
        # peaceiris/actions-gh-pages v4, verified commit.
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
          enable_jekyll: true
          commit_message: 'chore: refresh contribution snake [skip ci]'
