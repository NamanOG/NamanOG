name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create stats directory
        run: mkdir -p stats

      - name: Fetch GitHub Trophy SVG
        run: |
          curl -s "https://github-profile-trophy.vercel.app/?username=NamanOG&theme=onedark&column=6&margin-w=15&margin-h=15&no-frame=false" > stats/trophy.svg
          
      - name: Fetch GitHub Stats SVG
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=NamanOG&show_icons=true&theme=github_dark&bg_color=0d1117&title_color=58a6ff&icon_color=58a6ff&text_color=c9d1d9&border_color=30363d&hide_border=true&count_private=true" > stats/stats.svg

      - name: Fetch Top Languages SVG
        run: |
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=NamanOG&layout=compact&theme=github_dark&bg_color=0d1117&title_color=58a6ff&text_color=c9d1d9&border_color=30363d&hide_border=true" > stats/languages.svg

      - name: Fetch Activity Graph SVG
        run: |
          curl -s "https://github-readme-activity-graph.vercel.app/graph?username=NamanOG&theme=github-dark&bg_color=0d1117&color=58a6ff&line=58a6ff&point=ffffff&hide_border=true" > stats/activity.svg

      - name: Commit stats
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: Update GitHub stats"
          file_pattern: stats/*.svg
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
