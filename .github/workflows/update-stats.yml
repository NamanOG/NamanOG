name: Refresh profile widgets

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stats.yml'
      - '.github/scripts/**'

permissions:
  contents: read

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'NamanOG/NamanOG' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the profile
        # actions/checkout v4, resolved on 2026-10-10.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Check the refresh logic
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Refresh validated SVGs
        run: python3 .github/scripts/update_profile.py

      - name: Commit changed widgets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- stats/activity-light.svg stats/activity-dark.svg stats/contributions-light.svg stats/contributions-dark.svg stats/trophy-light.svg stats/trophy-dark.svg stats/streak-light.svg stats/streak-dark.svg
          if git diff --cached --quiet; then
            echo 'Profile widgets are already current.'
            exit 0
          fi
          git commit -m 'chore: refresh profile widgets [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
