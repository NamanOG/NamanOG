<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="560" height="112" viewBox="0 0 560 112" role="img" aria-labelledby="title desc">
<title id="title">On repeat on Apple Music: Ghost Town by Kanye West</title>
<desc id="desc">Ghost Town (feat. PARTYNEXTDOOR) from album ye by Kanye West playing on Apple Music.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .eq-1 { animation: eq 0.8s ease-in-out infinite alternate; transform-origin: 32px 28px; }
  .eq-2 { animation: eq 1.1s ease-in-out infinite alternate; animation-delay: -0.3s; transform-origin: 36px 28px; }
  .eq-3 { animation: eq 0.9s ease-in-out infinite alternate; animation-delay: -0.5s; transform-origin: 40px 28px; }
  @keyframes eq { 0% { transform: scaleY(0.25); } 100% { transform: scaleY(1.0); } }
  @media (prefers-reduced-motion: reduce) {
    .eq-1, .eq-2, .eq-3 { animation: none !important; }
  }
</style>
